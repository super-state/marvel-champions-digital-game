<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070c12" />
    <title>Spider-Man vs. Rhino · Marvel Champions</title>
  </head>
  <body>
    <main class="battle">
      <h1 class="visually-hidden">Spider-Man vs. Rhino</h1>
      <div class="arena">
        <section class="playfield" aria-label="Battle table">
          <div id="board-viewport" role="region" aria-label="Playmat">
            <div id="stage">
              <div id="space"></div>
              <div id="anchors" aria-label="Cards on the table">
                <div id="board-labels">
                  <button
                    id="encounter-discard"
                    class="pile-label"
                    type="button"
                    aria-expanded="false"
                    aria-controls="discard-fan"
                    disabled
                  >
                    <b id="encounter-discard-count">0</b>
                  </button>
                  <span id="encounter-label" class="pile-label" title="Encounter deck"
                    ><b id="encounter-count"></b
                  ></span>
                  <span id="deck-label" class="pile-label" title="Your deck"><b id="deck-count"></b></span>
                  <button
                    type="button"
                    id="discard-label"
                    class="pile-label"
                    aria-expanded="false"
                    aria-controls="discard-fan"
                    disabled
                  >
                    <b id="discard-count">0</b>
                  </button>
                </div>
                <div id="discard-fan" role="group" aria-label="Discarded cards" hidden></div>
              </div>
              <div id="form-flash" aria-hidden="true" hidden></div>
              <div id="form-hint" role="status" hidden>
                <svg aria-hidden="true" width="30" height="23" viewBox="0 0 40 28">
                  <path
                    fill="#ff796e"
                    stroke="#49191d"
                    stroke-width="1.6"
                    fill-rule="evenodd"
                    d="M2 4Q10 4 20 10Q30 4 38 4L36 18Q31 27 22 20L20 17L18 20Q9 27 4 18ZM7 11Q11 11 16 15Q10 19 7 11ZM33 11Q29 11 24 15Q30 19 33 11Z"
                  />
                </svg>
                <span>Hero form required</span>
              </div>
              <div id="play-refusal" role="status" hidden></div>
              <div id="action-beat" role="status" aria-live="polite" hidden></div>
              <div id="phase-banner" aria-hidden="true">
                <span><b></b></span>
              </div>
              <svg id="ability-glow" aria-hidden="true" hidden><g id="ability-outlines"></g></svg>
              <svg id="defense-shade" aria-hidden="true" hidden>
                <defs>
                  <mask id="defense-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                    <rect width="100%" height="100%" fill="white" />
                    <g id="defender-cutouts" fill="black"></g>
                    <g id="plate-cutouts" fill="black"></g>
                  </mask>
                </defs>
                <rect width="100%" height="100%" fill="#050911" opacity=".72" mask="url(#defense-mask)" />
              </svg>
              <div id="attack-reticle" aria-hidden="true" hidden></div>
              <div id="pending-mark" aria-hidden="true" hidden></div>
              <div id="choice-shade" hidden></div>
              <div id="focus-blur" aria-hidden="true" hidden></div>
              <span id="reveal-hint" aria-hidden="true" hidden></span>
              <div id="impact" aria-hidden="true" hidden></div>
              <section id="decision" aria-label="Card actions" hidden></section>
            </div>
          </div>
          <div class="phase-status">
            <button type="button" id="menu-button" class="menu-button" aria-label="Menu" title="Menu (Esc)"></button>
            <div class="phase-live" aria-live="polite">
              <span class="phase-chip" id="turn-status" data-phase="hero" role="status">Hero phase</span>
              <span class="dock-round" id="round-label">Round 1</span>
            </div>
          </div>
          <p class="visually-hidden" id="announcer" role="status" aria-live="polite"></p>
          <!-- The turn bar: what the game is asking, and the buttons that answer. On a wider screen it floats up by the
               card it is about, and folds away when there is nothing to say. -->
          <section id="dock" class="dock" aria-labelledby="dock-title" data-waiting>
            <span class="turn-mark" id="turn-mark" aria-hidden="true" hidden></span>
            <div class="dock-body" id="dock-body">
              <p class="eyebrow" id="dock-eyebrow" hidden></p>
              <h2 class="dock-title" id="dock-title" tabindex="-1">Dealing the opening hand…</h2>
              <p class="dock-help" id="instruction" role="status" aria-live="polite"></p>
            </div>
            <div class="meter" id="dock-meter" hidden>
              <strong id="payment-total"></strong>
              <div class="meter-track" aria-hidden="true"><span></span></div>
              <small id="payment-balance"></small>
            </div>
            <div class="dock-options" id="dock-options" hidden></div>
            <div class="dock-actions">
              <button
                type="button"
                id="undo"
                class="btn btn-ghost btn-icon"
                aria-label="Undo"
                title="Undo"
                disabled
              ></button>
              <button type="button" id="dock-secondary" class="btn btn-secondary" hidden></button>
              <button type="button" id="dock-primary" class="btn btn-primary" disabled>End Turn</button>
            </div>
          </section>
          <!-- A card pinned full size at the table's side with a right-click, to compare others against. -->
          <figure id="pinned-card" class="pinned-card" hidden>
            <img alt="" />
            <button type="button" class="pinned-close" aria-label="Unpin card" title="Unpin (Esc)">×</button>
          </figure>
          <!-- A hovered table card, full size beside it, while the card panel is folded away. -->
          <img id="hover-card" class="hover-card" alt="" hidden />
          <!-- Wider screens: Undo (moved here from the bar) keeps the bottom-left corner, End Turn the bottom-right. -->
          <div class="turn-corner turn-corner-left" id="undo-corner"></div>
          <div class="turn-corner" id="turn-corner">
            <button type="button" id="end-turn" class="btn btn-primary" disabled>End Turn</button>
          </div>
          <button
            type="button"
            id="rail-toggle"
            class="btn btn-ghost rail-toggle"
            aria-controls="rail"
            aria-expanded="true"
          ></button>
        </section>
        <aside class="rail" aria-label="Card preview and log" id="rail">
          <div id="reader" class="reader"><img id="preview" alt="" hidden /></div>
          <section class="log" aria-labelledby="log-title">
            <h3 id="log-title">Log</h3>
            <ol class="dock-feed" id="dock-feed"></ol>
          </section>
        </aside>
      </div>
    </main>
    <dialog id="menu" aria-labelledby="menu-title">
      <p class="eyebrow">Marvel Champions</p>
      <h2 id="menu-title">Spider-Man <i>vs.</i> Rhino</h2>
      <div class="menu-actions">
        <button type="button" id="menu-resume" class="btn btn-primary" autofocus>Resume</button>
        <button type="button" id="reset" class="btn btn-secondary" disabled>New game</button>
      </div>
      <div class="menu-setting" role="group" aria-labelledby="sidebar-side-label">
        <span id="sidebar-side-label">Sidebar</span>
        <button type="button" class="btn btn-option" data-side="left" aria-pressed="false">Left</button>
        <button type="button" class="btn btn-option" data-side="right" aria-pressed="true">Right</button>
      </div>
      <div class="menu-setting" role="group" aria-labelledby="sound-label">
        <span id="sound-label">Sound</span>
        <button type="button" class="btn btn-option" data-sound="on" aria-pressed="true">On</button>
        <button type="button" class="btn btn-option" data-sound="off" aria-pressed="false">Off</button>
      </div>
    </dialog>
    <dialog id="game-over" aria-labelledby="game-over-title" aria-describedby="game-over-detail">
      <div class="outcome-glow" aria-hidden="true"><div class="outcome-rays"></div></div>
      <div class="outcome-confetti" id="outcome-confetti" aria-hidden="true"></div>
      <div class="outcome-body">
        <figure class="outcome-card" aria-hidden="true">
          <img id="game-over-art" alt="" />
          <span class="outcome-stamp" id="game-over-stamp">Defeated</span>
        </figure>
        <p class="eyebrow outcome-kicker" id="game-over-kicker"></p>
        <h2 id="game-over-title">Game over</h2>
        <p id="game-over-detail"></p>
        <div class="game-over-actions">
          <button type="button" id="try-again" class="btn btn-primary" autofocus>Try Again</button>
          <button type="button" id="game-over-undo" class="btn btn-ghost">Undo last move</button>
        </div>
      </div>
    </dialog>
    <button type="button" id="read-reveal" hidden aria-label="Continue after reading the revealed card"></button>
    <script type="module" src="/src/battle-table/main.ts"></script>
  </body>
</html>
