body: "3D table: Captain Marvel's deck is audited card by card (her 15 cards, Family Emergency, her nemesis set and the nine Leadership cards). Her own Rechannel and Commander are in the hero's menu; Alpha Flight Station asks which card to discard; Energy Channel takes any number of energy; an upgrade on an ally (Inspired) is tucked under that ally; Kree Manipulator's order question says what each step does; clearer wording for Maria Hill, Vision, Make the Call and Inspired."
