kind: Changed
body: "Battle table: changes that used to happen silently now play out on the table: Highway Robbery takes a card from your hand facedown and gives it back when defeated, a deck that runs out shuffles its discard pile back in (with the facedown encounter card it costs you, or the acceleration token for the encounter deck), Shadow of the Past shows the nemesis cards it shuffles into the encounter deck, and Overkill, Helicarrier's discount and an effect with nothing to target are called out."
