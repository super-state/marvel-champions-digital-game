kind: Added
body: "The battle table points at what a question is about: asked to defend, the table darkens around the attacker (glowing red, with its attachments and boost card); an interrupt such as Great Responsibility first shows the scheme glowing with its +1 threat waiting and says what is about to happen; the villain phase's threat step gets the same moment; a boost card is stamped and tagged Boost beside the enemy it was dealt to, with the minions making room for it; and the title bar gives way to a menu button (or Esc, which first backs out of a card menu, a payment or a target pick) with Resume and New game."
