body: "3D table: the game opens in a room. The camera stands in the doorway under the game's name (and yours, on the test site); press any button for the menu, whose choices glide the camera to places in the room: Campaign to the villain boxes on the table, Settings to a radio on the shelf (sound, and which side the card panel sits). Free Play, Heroes & Decks and Trophies & Stats stand as furniture, coming soon. Escape or B goes back towards the doorway; with reduced motion the camera fades instead of gliding. New game still goes straight to the boxes."
