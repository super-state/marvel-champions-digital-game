kind: Added
body: "Play a repeatable Spider-Man versus Rhino opening hand on a Three.js table at /battle/. Cards lift on hover and snap back when the pointer moves away. Pick a card, then select cards to discard in a lightbox showing their resource values. Submit to send them to the discard pile in selection order, or cancel to return the played card to your hand. Click the pile to fan it out for inspection and click outside to stack it again."
