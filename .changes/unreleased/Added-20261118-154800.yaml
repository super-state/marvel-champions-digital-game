kind: Added
body: "Play a repeatable Spider-Man versus Rhino opening hand on a Three.js table at /battle/. Cards lift on hover and snap back when the pointer moves away. Pick a card, then select resources directly from the hand while the rest of the table dims. Submit to send the selected cards to the discard pile in order, or cancel to return the played card to your hand. Click the pile to fan it out for inspection and click outside to stack it again."
